server {
    server_name panel.meedo51.com;

    http2 on;

    # SSL - managed by Certbot
    ssl_certificate /etc/letsencrypt/live/panel.meedo51.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.meedo51.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 500M;

    # Proxy to NexusPanel
    location / {
        proxy_pass http://127.0.0.1:3443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_buffering off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/panel.meedo51.com_access.log;
    error_log /var/log/nginx/panel.meedo51.com_error.log;

    listen 443 ssl; # managed by Certbot
}
server {
    if ($host = panel.meedo51.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name panel.meedo51.com;
    return 404; # managed by Certbot


}