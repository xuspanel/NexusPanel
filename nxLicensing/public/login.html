<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nxLicensing — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo h1 { font-size: 24px; font-weight: 800; }
    .login-logo p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: #06b6d4; box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.15); }
    .form-error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: none;
    }
    .form-error.show { display: block; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #06b6d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0891b2; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <h1>🔑 nxLicensing</h1>
      <p>License Management System</p>
    </div>
    <div class="form-error" id="loginError"></div>
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="loginUsername" autocomplete="username" autocapitalize="off">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="loginPassword" type="password" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <script>
    var loginBtn = document.getElementById('loginBtn');
    var loginError = document.getElementById('loginError');

    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      var username = document.getElementById('loginUsername').value.trim();
      var password = document.getElementById('loginPassword').value.trim();
      if (!username || !password) return showError('Username and password required');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';
      loginError.classList.remove('show');

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        var data = await res.json();

        if (data.twoFactorRequired) {
          window.location.href = '/login.html?step=2fa&temp=' + encodeURIComponent(data.tempToken);
          return;
        }

        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/';
      } catch (err) {
        showError(err.message);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    }

    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.add('show');
    }
  </script>
</body>
</html>
