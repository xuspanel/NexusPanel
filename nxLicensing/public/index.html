<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nxLicensing — License Manager</title>
  <link rel="stylesheet" href="/css/licensing.css">
  <script defer src="/js/licensing.js"></script>
</head>
<body>
  <header class="l-header">
    <span class="l-logo">🔑 nxLicensing</span>
    <span class="l-sub">License Management Server</span>
    <span id="headerUser" style="font-size:12px;color:#94a3b8;margin-right:8px"></span>
    <a href="/profile.html" class="l-btn" style="text-decoration:none">👤 Profile</a>
    <button class="l-btn" onclick="refreshAll()">↻ Refresh</button>
  </header>

  <div class="l-stats-bar" id="statsBar"></div>

  <div class="l-actions">
    <button class="l-btn l-btn-primary" onclick="generateKeys()">+ Generate Keys</button>
    <input type="text" id="licenseSearch" placeholder="Search by key, name, or domain..." oninput="renderLicenses()">
  </div>

  <div class="l-bulk-bar" id="bulkBar" style="display:none">
    <span class="l-bulk-count" id="bulkCount">0 selected</span>
    <button class="l-btn l-btn-sm" onclick="bulkAction('activate')" title="Set selected to active">▶ Activate</button>
    <button class="l-btn l-btn-sm" onclick="bulkAction('suspend')" title="Suspend selected">⏸ Suspend</button>
    <button class="l-btn l-btn-sm" onclick="bulkAction('revoke')" title="Revoke selected">⛔ Revoke</button>
    <button class="l-btn l-btn-sm l-btn-danger" onclick="bulkAction('delete')" title="Delete selected">🗑 Delete</button>
    <button class="l-btn l-btn-sm" onclick="bulkExport()" title="Export selected as CSV">📥 Export CSV</button>
    <button class="l-btn l-btn-sm" onclick="deselectAll()">✕ Clear</button>
  </div>

  <div id="licenseTable"></div>

  <div class="l-modal-overlay" id="genModalOverlay" style="display:none" onclick="if(event.target===this)closeGenModal()">
    <div class="l-modal">
      <div class="l-modal-header">Generate License Keys<button class="l-modal-close" onclick="closeGenModal()">✕</button></div>
      <div class="l-modal-body">
        <label>Count<input type="number" id="genCount" value="1" min="1" max="100"></label>
        <label>Max Domains<input type="number" id="genMaxDomains" value="5" min="1"></label>
        <label>Expires (months, leave empty for never)<input type="number" id="genExpiry" value="12" placeholder="Never"></label>
        <label>Issued To<input type="text" id="genIssuedTo" placeholder="Customer/Company name"></label>
        <label>Notes<input type="text" id="genNotes" placeholder="Optional notes"></label>
        <button class="l-btn l-btn-primary" onclick="doGenerate()">Generate</button>
        <div id="genResults"></div>
      </div>
    </div>
  </div>

  <div class="l-modal-overlay" id="detailModalOverlay" style="display:none" onclick="if(event.target===this)closeDetailModal()">
    <div class="l-modal">
      <div class="l-modal-header">License Details<button class="l-modal-close" onclick="closeDetailModal()">✕</button></div>
      <div class="l-modal-body" id="detailBody"></div>
    </div>
  </div>

  <div class="l-toast" id="lToast" style="display:none"></div>
</body>
</html>
