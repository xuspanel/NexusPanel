<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — nxLicensing</title>
  <link rel="stylesheet" href="/css/licensing.css">
  <style>
    .profile-card {
      max-width: 560px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 32px;
    }
    .profile-card h2 { margin-bottom: 24px; font-size: 18px; }
    .profile-field { margin-bottom: 20px; }
    .profile-field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .profile-field input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }
    .profile-field input:focus { border-color: #06b6d4; }
    .profile-field .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
    .profile-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .profile-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .profile-btn-primary { background: #06b6d4; border-color: #06b6d4; color: #fff; }
    .profile-btn-primary:hover { background: #0891b2; }
    .profile-btn-danger { background: #ef4444; border-color: #ef4444; color: #fff; }
    .profile-btn-danger:hover { background: #dc2626; }
    .profile-2fa-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .profile-2fa-status.on { background: rgba(16, 185, 129, 0.12); color: #10b981; }
    .profile-2fa-status.off { background: rgba(100, 116, 139, 0.12); color: #94a3b8; }
    .profile-qr { text-align: center; margin: 16px 0; }
    .profile-qr img { border-radius: 8px; background: #fff; padding: 8px; }
    .profile-msg {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .profile-msg.success { display: block; background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
    .profile-msg.error { display: block; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    .back-link { color: #06b6d4; text-decoration: none; font-size: 13px; }
    a { color: #06b6d4; }
  </style>
</head>
<body>
  <header class="l-header">
    <a href="/" class="back-link">← Back to Dashboard</a>
    <span class="l-logo" style="flex:1">👤 Profile</span>
    <button class="l-btn l-btn-danger" onclick="doLogout()">Logout</button>
  </header>

  <div class="profile-card" id="profileContent">
    <div style="text-align:center;padding:40px">Loading...</div>
  </div>

  <script>
    async function api(method, path, body) {
      var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      var res = await fetch(path, opts);
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function loadProfile() {
      try {
        var profile = await api('GET', '/api/auth/me');
        renderProfile(profile);
      } catch (e) {
        window.location.href = '/login.html';
      }
    }

    function esc(s) { return s ? String(s).replace(/[&<>"']/g, function(c) { return '&#' + c.charCodeAt(0) + ';'; }) : ''; }

    function renderProfile(p) {
      var html = '<h2>Account Settings</h2>';

      html += '<div class="profile-field"><label>Username</label><input value="' + esc(p.username) + '" disabled></div>';
      html += '<div class="profile-field"><label>Email</label><input id="profEmail" value="' + esc(p.email || '') + '"><p class="hint">Contact email for notifications</p><button class="profile-btn profile-btn-primary" onclick="saveEmail()">Save Email</button></div>';
      html += '<div style="margin:20px 0;border-top:1px solid rgba(255,255,255,0.06)"></div>';

      html += '<h3>Change Password</h3>';
      html += '<div class="profile-field"><label>Current Password</label><input id="profCurrPass" type="password"></div>';
      html += '<div class="profile-field"><label>New Password</label><input id="profNewPass" type="password"><p class="hint">Minimum 6 characters</p></div>';
      html += '<button class="profile-btn profile-btn-primary" onclick="savePassword()">Change Password</button>';
      html += '<div class="profile-msg" id="passMsg"></div>';

      html += '<div style="margin:20px 0;border-top:1px solid rgba(255,255,255,0.06)"></div>';

      html += '<h3>Two-Factor Authentication</h3>';
      html += '<p style="color:#94a3b8;font-size:13px;margin:8px 0">Status: <span class="profile-2fa-status ' + (p.twoFactorEnabled ? 'on' : 'off') + '">' + (p.twoFactorEnabled ? 'Enabled' : 'Disabled') + '</span></p>';

      if (!p.twoFactorEnabled) {
        html += '<button class="profile-btn profile-btn-primary" id="setup2faBtn" onclick="setup2FA()">Set Up 2FA</button>';
        html += '<div id="twoFASetup" style="display:none"></div>';
      } else {
        html += '<button class="profile-btn profile-btn-danger" onclick="disable2FA()">Disable 2FA</button>';
      }
      html += '<div class="profile-msg" id="twoFAMsg"></div>';

      document.getElementById('profileContent').innerHTML = html;
    }

    async function saveEmail() {
      try {
        await api('PUT', '/api/profile/email', { email: document.getElementById('profEmail').value.trim() });
        showMsg('passMsg', 'Email updated', 'success');
      } catch (e) { showMsg('passMsg', e.message, 'error'); }
    }

    async function savePassword() {
      try {
        await api('PUT', '/api/profile/password', {
          currentPassword: document.getElementById('profCurrPass').value,
          newPassword: document.getElementById('profNewPass').value,
        });
        showMsg('passMsg', 'Password changed successfully', 'success');
        document.getElementById('profCurrPass').value = '';
        document.getElementById('profNewPass').value = '';
      } catch (e) { showMsg('passMsg', e.message, 'error'); }
    }

    async function setup2FA() {
      try {
        var data = await api('POST', '/api/profile/2fa/setup');
        var el = document.getElementById('twoFASetup');
        el.style.display = 'block';
        el.innerHTML = '<div class="profile-qr"><img src="' + data.qrCode + '" alt="QR Code"></div>'
          + '<p style="font-size:12px;color:#94a3b8;margin:8px 0">Secret: <code style="color:#06b6d4;font-family:monospace">' + data.secret + '</code></p>'
          + '<div class="profile-field"><label>Enter 6-digit code from your authenticator app</label><input id="twoFAToken" placeholder="000000"></div>'
          + '<button class="profile-btn profile-btn-primary" onclick="verify2FA()">Verify & Enable</button>';
        document.getElementById('setup2faBtn').style.display = 'none';
      } catch (e) { showMsg('twoFAMsg', e.message, 'error'); }
    }

    async function verify2FA() {
      try {
        var token = document.getElementById('twoFAToken').value.trim();
        await api('POST', '/api/profile/2fa/verify', { token: token });
        showMsg('twoFAMsg', '2FA enabled successfully', 'success');
        setTimeout(function() { window.location.reload(); }, 1500);
      } catch (e) { showMsg('twoFAMsg', e.message, 'error'); }
    }

    async function disable2FA() {
      if (!confirm('Disable two-factor authentication?')) return;
      try {
        await api('POST', '/api/profile/2fa/disable');
        window.location.reload();
      } catch (e) { showMsg('twoFAMsg', e.message, 'error'); }
    }

    function showMsg(id, msg, type) {
      var el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'profile-msg ' + type;
      setTimeout(function() { el.className = 'profile-msg'; }, 5000);
    }

    async function doLogout() {
      await api('POST', '/api/auth/logout');
      window.location.href = '/login.html';
    }

    loadProfile();
  </script>
</body>
</html>
